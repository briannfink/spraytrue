# Weekly refresh of the WSDA product index used by TankMix search.
# Copy this workflow into the GitHub Pages deploy repo (briannfink/tankmix) if you
# want Actions to re-scrape fortress.wa.gov. It is polite (~1 req/s) and only
# commits when the file changes. Default job scrapes adjuvants + 25(b) + fertilizers;
# add --section3 for the large Section 3 pesticide list (slow, ~hours).
name: Update WSDA product index
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scrape WSDA public search
        run: python3 tools/update_wsda.py --adjuvants --minrisk --fertilizer
      - name: Rebuild preview data copy
        run: |
          python3 tools/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wsda-products.json preview/wsda-products.json dist/wsda-products.json || true
          git diff --cached --quiet && echo "No WSDA changes" && exit 0
          git commit -m "chore: refresh WSDA product index"
          git push
