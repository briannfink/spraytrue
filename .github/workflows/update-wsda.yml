# SprayTrue's weekly WSDA refresh. Deploy repo contains built HTML, not source/build.py.
# Pages publishes from branch main (/). Pushing the data commit is the only publication.
# Do not also call deploy-pages: that records this workflow's starting SHA and blocks
# the branch build of the new commit.
name: Update WSDA product index
on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: wsda-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test incomplete-refresh rejection and Pages publication rules (offline fixtures)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Scrape WSDA public search
        run: python3 tools/update_wsda.py --adjuvants --minrisk --fertilizer
      - name: Copy dataset to published live and preview paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, hashlib, re
          src = Path('data/wsda-products.json')
          for target in ['wsda-products.json', 'preview/wsda-products.json']:
              p = Path(target)
              p.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, p)
          # Match tools/build.py: changed WSDA data must also invalidate the offline shell.
          index = Path('index.html').read_bytes()
          version = re.search(rb'APP_VERSION\s*=\s*"([^"]+)"', index).group(1).decode()
          digest = hashlib.sha1(index + src.read_bytes()).hexdigest()[:8]
          sw = Path('sw.js')
          sw.write_text(re.sub(r'const CACHE = "[^"]+";', f'const CACHE = "spraytrue-{version}-{digest}";', sw.read_text()))
          PY
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wsda-products.json wsda-products.json preview/wsda-products.json sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh WSDA product index"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for Pages to publish the data commit
        if: steps.commit.outputs.changed == 'true'
        env:
          PAGES_SHA: ${{ steps.commit.outputs.sha }}
          PAGES_TIMEOUT_SECONDS: "600"
          PAGES_POLL_SECONDS: "10"
        run: python3 tools/wait_for_pages.py
      - name: Report a failed or incomplete refresh
        if: failure()
        run: |
          echo "### WSDA refresh rejected or failed" >> "$GITHUB_STEP_SUMMARY"
          echo "If the scrape failed, the previous data files were left unchanged. If this failed after the data commit, that commit is on main but GitHub Pages did not finish publishing it. See the logs." >> "$GITHUB_STEP_SUMMARY"
